# =============================================================
# Regalo Secreto — despliegue en Render (Blueprint automático)
#
# Cómo usarlo:
#   1. Sube el proyecto a GitHub (ya con este archivo).
#   2. En render.com → New → Blueprint → elige tu repositorio.
#   3. Render lee este archivo y crea el sitio estático solo.
#   4. Al teclar los valores que aparecen como "sync: false"
#      (son las credenciales) y ¡listo!
# =============================================================

services:
  - type: web
    name: regalo-secreto
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit

    # Vue Router usa rutas de una sola página (/app/pistas, /entrar…).
    # Render NO aplica la regla si el archivo existe (sw.js, fotos, videos…),
    # así que solo redirige al index.html las rutas de la aplicación.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Cabeceras de seguridad + caché para la PWA
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache

    envVars:
      # Ponlas tú mismo en el panel de Render (Environment → Environment Variables)
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
